name: Build MacHealth

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
    
    - name: Build
      run: |
        xcodebuild -project MacHealth.xcodeproj \
          -scheme MacHealth \
          -configuration Release \
          -derivedDataPath build \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          ENABLE_APP_SANDBOX=NO \
          build
    
    - name: Create ZIP
      run: |
        cd build/Build/Products/Release
        zip -r ../../../../MacHealth.zip MacHealth.app
        cd ../../../..
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MacHealth
        path: MacHealth.zip
    
    - name: Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: MacHealth.zip
        name: "MacHealth ${{ github.ref_name }}"
        body: |
          ## 🏥 MacHealth ${{ github.ref_name }}
          
          Безкоштовна програма діагностики MacBook та iPhone.
          
          ### 📥 Як встановити:
          1. Завантажте `MacHealth.zip`
          2. Розпакуйте архів
          3. Перемістіть `MacHealth.app` в папку «Програми»
          4. При першому запуску: ПКМ → «Відкрити»
          5. Або в Терміналі: `xattr -cr /Applications/MacHealth.app`

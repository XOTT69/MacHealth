name: Build MacHealth

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Build
      run: |
        xcodebuild -version
        xcodebuild -project MacHealth.xcodeproj \
          -scheme MacHealth \
          -configuration Release \
          -derivedDataPath build \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          ENABLE_APP_SANDBOX=NO \
          build
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        # GitHub сам створює ZIP для artifacts. Завантажуємо .app напряму,
        # щоб уникнути ZIP усередині ZIP.
        name: MacHealth-macOS
        path: build/Build/Products/Release/MacHealth.app

    - name: Create release ZIP
      if: startsWith(github.ref, 'refs/tags/v')
      working-directory: build/Build/Products/Release
      run: zip -r "$GITHUB_WORKSPACE/MacHealth.zip" MacHealth.app
    
    - name: Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: MacHealth.zip
        name: "MacHealth ${{ github.ref_name }}"
        body: |
          ## 🏥 MacHealth ${{ github.ref_name }}
          
          Безкоштовна програма діагностики MacBook та iPhone.
          
          ### 📥 Як встановити:
          1. Завантажте `MacHealth.zip`
          2. Розпакуйте архів
          3. Перемістіть `MacHealth.app` в папку «Програми»
          4. При першому запуску: ПКМ → «Відкрити»
          5. Або в Терміналі: `xattr -cr /Applications/MacHealth.app`
